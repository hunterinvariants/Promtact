name: kernel-build

on:
  push:
    paths:
      - "bpf/**"
      - "chaos/**"
      - "cmd/promtact-chaos/**"
      - "internal/cli/chaos_linux*"
      - "storage/uring/**"
      - ".github/workflows/kernel.yml"
  pull_request:
  # The paths filter above means this can sit for weeks without running, so a
  # transient runner failure freezes the badge in the README on a result the
  # code has since passed. Without a manual trigger the only way to clear it is
  # to touch one of those paths, which is a commit made for the badge rather
  # than for the code.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-kernel-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev
      - run: go test ./chaos ./internal/cli ./storage/uring
      - run: go build ./cmd/promtact-chaos ./cmd/promtact
      - run: clang -O2 -g -target bpf -D__TARGET_ARCH_x86 -I/usr/include/$(gcc -dumpmachine) -c bpf/promtact_chaos.bpf.c -o /tmp/promtact_chaos.bpf.o

