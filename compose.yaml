services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promtact
      POSTGRES_USER: promtact
      POSTGRES_PASSWORD: promtact
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promtact -d promtact"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
