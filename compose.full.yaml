services:
  promtact:
    build:
      context: .
    command:
      - --addr
      - 0.0.0.0:8080
      - --web
      - /app/web
      - --postgres-dsn
      - postgres://promtact:promtact@postgres:5432/promtact?sslmode=disable
      - --policy
      - /app/configs/example.policy.json
      - --demo
    environment:
      PROMTACT_API_TOKEN: ${PROMTACT_API_TOKEN:-local-development-token}
      PROMTACT_SESSION_SECRET: ${PROMTACT_SESSION_SECRET:-local-development-session-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promtact
      POSTGRES_USER: promtact
      POSTGRES_PASSWORD: promtact
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promtact -d promtact"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
