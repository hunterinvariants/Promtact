name = "promtact-alerts"
main = "worker.js"
compatibility_date = "2026-01-01"

# Preview deployments would otherwise each get their own public URL. The endpoint
# is token-protected either way, but there is no reason to expose more of it.
preview_urls = false

# Serve the receiver from your own domain, e.g. alerts.example.com.
# Replace the zone and pattern, then `npx wrangler deploy`.
# [[routes]]
# pattern = "alerts.example.com/*"
# custom_domain = true

# The witness store. Create it once and paste the id here:
#   npx wrangler kv namespace create ANCHORS
# Without this binding the /anchor endpoint returns 503 and the alert receiver
# keeps working unchanged.
[[kv_namespaces]]
binding = "ANCHORS"
id = "1eabfd38ffdf46bbaec6cfd9ab4f1f58"

# Secrets are set with `wrangler secret put`, never committed:
#   ALERT_SHARED_SECRET   (required) the bearer token the sender presents
#   ANCHOR_SHARED_SECRET  (optional) separate token for the audit witness;
#                         falls back to ALERT_SHARED_SECRET when unset
#   NTFY_TOPIC            (optional) push to a phone via ntfy.sh
#   DISCORD_WEBHOOK_URL   (optional)
#   SLACK_WEBHOOK_URL     (optional)
